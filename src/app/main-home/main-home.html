<main class="home-conatiner">
  <section class="home-section">
    <div class="box-main-info">
      <div class="imagem-logo">
        <img
          [@fadeAnimation]
          [src]="images[currentImageIndex]"
          alt="Logo"
          class="carousel-image"
        />
      </div>
      <div class="box-main-info-text">
        <h1>{{ 'HOME.TITLE' | translate }}</h1>
        <p>{{ 'HOME.SUBTITLE' | translate }}</p>
        <button class="button-start">{{ 'HOME.ADD_BOT_BUTTON' | translate }}</button>
      </div>
    </div>
  </section>
</main>
